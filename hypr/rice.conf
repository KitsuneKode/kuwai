# The rice's Hyprland side. Sourced from ~/.config/hypr/userprefs.conf:
#   source = ~/Projects/rice/hypr/rice.conf
#
# Every rice surface is a layer named rice-*. Each one draws its own glass
# and its own enter/exit motion, so Hyprland only blurs real windows behind
# it (not just the wallpaper, as the global xray rule does), only where the
# card is (tint ~46% alpha, margins clear), and doesn't animate it.

exec-once = ~/Projects/rice/bin/rice-shell

# Shortcuts go straight into the running shell through Hyprland's global
# shortcuts (the `global` dispatcher → GlobalShortcut in shell/modules/Shortcuts.qml):
# no process per keypress, so the center answers on the same frame.
# kittymux's own kitty panel moved to Super+Ctrl+Shift+N (userprefs.conf).
bindd = SUPER, N, Notifications, global, rice:center
bindd = SUPER SHIFT, N, Agents (kittymux), global, rice:agents
bindd = SUPER ALT, N, Do not disturb, global, rice:dnd
bindd = SUPER SHIFT ALT, N, Open the newest notification, global, rice:open-latest

layerrule {
    name = rice-glass
    match:namespace = ^rice-.*$
    blur = on
    ignore_alpha = 0.3
    xray = 0
    no_anim = on
}

# The center is a menu above everything: the shell draws its own scrim
# (rice.scrim, deliberately outside rice-* so nothing blurs under it) and
# fades it with the card; Hyprland only keeps its hands off.
layerrule {
    name = rice-scrim
    match:namespace = ^rice\.scrim$
    no_anim = on
}
