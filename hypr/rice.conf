# The rice's Hyprland side. Sourced from ~/.config/hypr/userprefs.conf:
#   source = ~/Projects/rice/hypr/rice.conf
#
# Every rice surface is a layer named rice-*. Each one draws its own glass
# and its own enter/exit motion, so Hyprland only blurs real windows behind
# it (not just the wallpaper, as the global xray rule does), only where the
# card is (tint ~46% alpha, margins clear), and doesn't animate it.

exec-once = ~/Projects/rice/bin/rice-shell
# When each copy happened (cliphist keeps no times): the clipboard's dates.
exec-once = wl-paste --watch ~/Projects/rice/bin/rice-clip stamp

# Shortcuts go straight into the running shell through Hyprland's global
# shortcuts (the `global` dispatcher → GlobalShortcut in shell/modules/Shortcuts.qml):
# no process per keypress, so the center answers on the same frame.
# kittymux's own kitty panel moved to Super+Ctrl+Shift+N (userprefs.conf).
bindd = SUPER, N, Notifications, global, rice:center
bindd = SUPER SHIFT, N, Agents (kittymux), global, rice:agents
bindd = SUPER ALT, N, Do not disturb, global, rice:dnd
bindd = SUPER SHIFT ALT, N, Open the newest notification, global, rice:open-latest

# Clipboard: the rice's panel instead of HyDE's rofi menus (cliphist stays
# the store). Super+Shift+V and Super+Alt+V open it on the pins.
unbind = SUPER, V
unbind = SUPER SHIFT, V
unbind = SUPER ALT, V
bindd = SUPER, V, Clipboard, global, rice:clipboard
bindd = SUPER SHIFT, V, Clipboard pins, global, rice:clipboard-pins
bindd = SUPER ALT, V, Clipboard pins, global, rice:clipboard-pins

# Screenshots: bin/rice-shot instead of HyDE's script. A cancelled pick says
# nothing; Satty opens floating, centred and focused (so Super+Q closes it,
# not the window under the mouse).
unbind = SUPER, P
unbind = SUPER CTRL, P
unbind = SUPER CTRL SHIFT, P
unbind = , Print
bindd = SUPER, P, Screenshot a region, exec, ~/Projects/rice/bin/rice-shot area
bindd = SUPER CTRL, P, Freeze then screenshot a region, exec, ~/Projects/rice/bin/rice-shot freeze
bindd = SUPER CTRL SHIFT, P, Screenshot this monitor, exec, ~/Projects/rice/bin/rice-shot monitor
bindd = , Print, Screenshot every monitor, exec, ~/Projects/rice/bin/rice-shot all
windowrule = float on, center on, size 82% 82%, match:class ^(com\.gabm\.satty)$

# The clipboard's "Edit in Neovim": a floating, centred editor window.
windowrule = float on, size 1100 760, center on, match:class ^(rice-edit)$

layerrule {
    name = rice-glass
    match:namespace = ^rice-.*$
    blur = on
    ignore_alpha = 0.3
    xray = 0
    no_anim = on
}

# The center is a menu above everything: the shell draws its own scrim
# (rice.scrim, deliberately outside rice-* so nothing blurs under it) and
# fades it with the card; Hyprland only keeps its hands off.
layerrule {
    name = rice-scrim
    match:namespace = ^rice\.scrim$
    no_anim = on
}

# ── Motion: quick, not sluggish ──────────────────────────────────────────
# Hyprland speeds are in tenths of a second. The theme's were 6–7 (600–700ms
# for every window and workspace change: the "Apple sluggish" feel). These
# follow Omarchy (refs/omarchy/default/hypr/looknfeel.lua) and the shell's
# own Theme.easeOut: one strong ease-out curve, ~250ms in, ~160ms out, new
# windows from 95%. Omarchy turns workspace motion off; here it's a short
# slide that fades, so the direction still reads. Remove this block for the
# theme's motion; the center's Reduce Motion or `animations:enabled = 0`
# for none.
bezier = riceOut, 0.23, 1, 0.32, 1
animation = windows, 1, 2.5, riceOut, slide
animation = windowsIn, 1, 2.5, riceOut, popin 95%
animation = windowsOut, 1, 1.6, riceOut, popin 95%
animation = windowsMove, 1, 2.5, riceOut, slide
animation = workspaces, 1, 2.5, riceOut, slidefade 8%
animation = specialWorkspaceIn, 1, 2.5, riceOut, slidevert
animation = specialWorkspaceOut, 1, 1.6, riceOut, slidevert
animation = fadeIn, 1, 1.8, riceOut
animation = fadeOut, 1, 1.2, riceOut
animation = border, 1, 1.5, riceOut
