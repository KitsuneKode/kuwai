# kuwai's idle: dim, lock, screens off, and (on battery only) sleep.
# Installed as ~/.config/hypr/hypridle.conf (a symlink to this file).
#
# Anything that asks to stay awake is respected: a video or call (D-Bus
# idle inhibit), `systemd-inhibit --what=idle`, and the island's Caffeine
# (Wayland idle inhibit; Controls, the System panel or Super+Shift+C).
#
#   4:00   the laptop panel dims to 40 % of where it was, keyboard light off
#   4:45   the screens fade slowly towards black (any input cancels: no lock)
#   5:00   lock (the shell's lock screen; hyprlock if the shell is down)
#   5:30   screens off
#   20:00  sleep — only on battery: plugged in (the Acer, a download, music)
#          it stays up; the lock and the dark screens are enough

general {
    lock_cmd = rice lock                                  # `loginctl lock-session`, Super+L
    before_sleep_cmd = rice lock --wait                   # every suspend locks first, and waits until it is
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Dim, not black: 40 % of the current level (it used to drop to 1 %, which
# read as the screen cutting out while you were only reading).
listener {
    timeout = 240
    on-timeout = sh -c 'brightnessctl -s >/dev/null; c=$(brightnessctl -m | cut -d, -f4 | tr -d %); brightnessctl -q set "$(( c * 4 / 10 > 1 ? c * 4 / 10 : 1 ))%"'
    on-resume = brightnessctl -qr
}

listener {
    timeout = 240
    on-timeout = brightnessctl -sqd rgb:kbd_backlight set 0
    on-resume = brightnessctl -qrd rgb:kbd_backlight
}

listener {
    timeout = 285
    on-timeout = rice fade start
    on-resume = rice fade stop
}

listener {
    timeout = 300
    on-timeout = rice lock
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1200
    on-timeout = sh -c 'for a in /sys/class/power_supply/A*/online; do [ "$(cat "$a")" = 1 ] && exit 0; done; systemctl suspend'
}
