name: Checks

# Every check here fails the run when it fails: no step is allowed to skip
# itself or swallow an error. What hosted runners can't do (load the shell,
# which needs a Wayland session; Hyprland --verify-config) stays with
# `rice-check` and `kuwai doctor`, which `rice promote` runs first.

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed python python-pytest ripgrep lua qt6-declarative bash git
      - uses: actions/checkout@v4
      - name: QML syntax (every file)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            /usr/lib/qt6/bin/qmllint --bare -W 0 --max-warnings -1 --syntax error "$f" || { echo "::error file=$f::QML syntax"; fail=1; }
          done < <(find shell greeter -name '*.qml' -print0 2>/dev/null)
          exit $fail
      - name: Lua syntax
        run: |
          fail=0
          while IFS= read -r -d '' f; do luac -p "$f" || fail=1; done < <(find hypr -name '*.lua' -print0)
          exit $fail
      - name: Bash syntax
        run: |
          fail=0
          for f in install.sh $(grep -lE '^#!.*\b(ba)?sh\b' bin/* greeter/install system/install 2>/dev/null); do
            bash -n "$f" || fail=1
          done
          exit $fail
      - name: Python tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider tests
      - name: Hyprland config tests
        run: for t in tests/hypr/test_*.lua; do lua "$t" || exit 1; done
      - name: Design tokens only go down
        run: bin/rice-tokens --check

  chat-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test shell/services/ai/turn.test.mjs tests/shell/privacy.test.mjs tests/shell/calc.test.mjs tests/shell/proximity.test.mjs tests/shell/settings-search.test.mjs
